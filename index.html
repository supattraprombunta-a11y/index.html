<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LOCKED HOUSE</title>
<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
 75, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// พื้น
const floorGeometry = new THREE.PlaneGeometry(50,50);
const floorMaterial = new THREE.MeshBasicMaterial({color:0x222222});
const floor = new THREE.Mesh(floorGeometry,floorMaterial);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// กล่องผนัง
const wallGeometry = new THREE.BoxGeometry(50,10,1);
const wallMaterial = new THREE.MeshBasicMaterial({color:0x444444});

const wall1 = new THREE.Mesh(wallGeometry,wallMaterial);
wall1.position.set(0,5,-25);
scene.add(wall1);

const wall2 = new THREE.Mesh(wallGeometry,wallMaterial);
wall2.position.set(0,5,25);
scene.add(wall2);

camera.position.y = 2;
camera.position.z = 5;

// ระบบเดิน
let keys = {};

document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

function animate(){
 requestAnimationFrame(animate);

 if(keys["w"]) camera.position.z -= 0.1;
 if(keys["s"]) camera.position.z += 0.1;
 if(keys["a"]) camera.position.x -= 0.1;
 if(keys["d"]) camera.position.x += 0.1;

 renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
